name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Unsigned Archive
        run: |
          xcodebuild \
            -project Madar.xcodeproj \
            -scheme Madar \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Madar.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Create Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/Madar.xcarchive/Products/Applications/Madar.app" Payload/
          zip -r Madar-Unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madar-Unsigned-IPA
          path: Madar-Unsigned.ipa
